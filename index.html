:root{--bg:#F2F4EF;--card:#fff;--ink:#14170F;--muted:#6B7266;--line:#E1E5DC;--dark:#13160F;--dark2:#1E2318;--lime:#B8E81A;--lime2:#D4F56A;--green:#1E8E5A;--red:#D14B3F;--amber:#D99A1E;--blue:#2F6FB5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
.app{min-height:100vh;color:var(--ink);font-family:-apple-system,"SF Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{background:var(--dark);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--lime)}
.top-in{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:13px;background:var(--lime);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.top h1{margin:0;font-size:19px;font-weight:800}.top small{color:#A8B09C;font-size:12.5px}
.ibtn{margin-inline-start:auto;width:42px;height:42px;border-radius:12px;border:0;background:var(--dark2);color:#fff;font-size:19px;cursor:pointer}
.ibtn+.ibtn{margin-inline-start:0}
.main{max-width:760px;margin:0 auto;padding:14px}
.h2{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.h2 b{font-size:17px}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:12px}
.month button{border:0;background:#EEF1EA;border-radius:10px;width:40px;height:36px;font-size:18px;cursor:pointer}.month b{font-size:16px}
.hero{background:var(--dark);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-30px;bottom:-40px;width:160px;height:160px;border-radius:50%;background:var(--lime);opacity:.12}
.hero small{color:#A8B09C;font-weight:600}.hero .big{font-size:38px;font-weight:900;letter-spacing:-.5px;direction:ltr;text-align:right;color:var(--lime)}
.hero .big.neg{color:#FF8A7E}
.hero .eq{font-size:12.5px;color:#C9D0BD;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}.kpi b{display:block;font-size:20px;font-weight:800;direction:ltr;text-align:right;margin-top:2px}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.red b{color:var(--red)}.kpi.green b{color:var(--green)}.kpi.blue b{color:var(--blue)}
.wallet{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1E2318,#2A3220);color:#fff;border-radius:18px;padding:14px 16px;margin-top:10px}
.wallet .v{font-size:24px;font-weight:900;direction:ltr;color:var(--lime)}.wallet .v.low{color:#FF8A7E}
.wallet small{color:#A8B09C}
.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:#E7EBE1;color:var(--ink)}
.btn.lime{background:var(--lime);color:var(--dark)}.btn.dark{background:var(--dark);color:#fff}.btn.red{background:#FBE3E0;color:var(--red)}.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%;padding:15px;font-size:16px}
.alert{border-radius:14px;padding:11px 14px;font-weight:600;font-size:14px;margin-top:8px;display:block}
.alert.red{background:#FBE3E0;color:#9B2C22}.alert.amber{background:#FCF1D6;color:#7A5200}.alert.green{background:#E3F4E8;color:#1E6B45}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.row .d{width:52px;text-align:center;flex-shrink:0;border-inline-end:1px solid var(--line);padding-inline-end:10px}.row .d b{display:block;font-size:20px;line-height:1.1}.row .d small{color:var(--muted);font-size:11.5px}
.row .body{flex:1;min-width:0}.row .t{font-weight:700}.row .s{color:var(--muted);font-size:13px}
.row .amt{font-weight:800;direction:ltr;white-space:nowrap}.pos{color:var(--green)}.neg{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;background:var(--card);border:1.5px dashed var(--line);border-radius:16px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--dark);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;border-top:3px solid var(--lime)}
.bottom button{border:0;background:none;color:#8E977F;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;font-size:11.5px;font-weight:700;padding:4px;cursor:pointer}
.bottom button span{font-size:21px}.bottom button.on{color:var(--lime)}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--lime);color:var(--dark);font-size:30px;font-weight:800;box-shadow:0 10px 22px -8px rgba(0,0,0,.45);z-index:25;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,12,8,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.sh b{font-size:17px}
.sh button{border:0;background:#EEF1EA;border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.sb{padding:16px 18px;overflow-y:auto}.sf{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fld{display:flex;flex-direction:column;gap:5px}.fld.w{grid-column:1/-1}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FAFBF8;width:100%;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--lime);background:#fff}
.fld input[type=number],.fld input[type=date],.fld input[type=time]{direction:ltr;text-align:right}
.calc{margin-top:14px;background:#F3F6EE;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc div small{display:block;color:var(--muted);font-size:12px}.calc div b{direction:ltr;display:block;text-align:right}
.calc .big{grid-column:1/-1;border-top:1px dashed #C9D0BD;padding-top:8px;display:flex;justify-content:space-between;align-items:center}.calc .big b{font-size:22px}
.sec{font-size:13px;font-weight:800;color:var(--dark);margin:6px 0 -4px;grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{color:var(--muted);font-weight:700;padding:7px 5px;border-bottom:2px solid var(--dark);white-space:nowrap}
.tbl td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;direction:ltr}.tbl td:first-child{direction:rtl;text-align:start;font-weight:700}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--dark);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:60;border-inline-start:4px solid var(--lime);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}.chip.on{background:var(--dark);color:var(--lime);border-color:var(--dark)}
.live{width:100%;display:flex;align-items:center;gap:12px;border:2px dashed #9DC21A;background:#F7FBE8;border-radius:18px;padding:14px 16px;margin-bottom:12px;font:inherit;color:var(--ink);cursor:pointer}
.live b{display:block;font-size:17px}.live small{color:var(--muted);font-size:12.5px}
.live.on{border:0;background:var(--lime);cursor:default}.live.on small{color:#2A3310}
.live .dot{width:14px;height:14px;border-radius:50%;background:#1E8E5A;box-shadow:0 0 0 0 rgba(30,142,90,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,142,90,.6)}70%{box-shadow:0 0 0 12px rgba(30,142,90,0)}100%{box-shadow:0 0 0 0 rgba(30,142,90,0)}}
.sess{grid-column:1/-1;background:#F7F9F3;border:1px solid var(--line);border-radius:14px;padding:10px}
.sess-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sess-h .x{margin-inline-start:auto;border:0;background:none;font-size:16px;cursor:pointer}
.sess-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sess-g .fld input{padding:9px 10px}
.gap{font-size:12.5px;color:#7A5200;background:#FCF1D6;border-radius:8px;padding:4px 8px;margin-bottom:8px;display:inline-block}
.lockdate{padding:11px 12px;border:1.5px dashed var(--line);border-radius:12px;background:#F3F6EE}
.fuelbox{background:#FFF7E6;border:1px solid #F1DDB0;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fuelbox>div{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center}.fuelbox small{color:var(--muted);font-weight:700}
.fuelbox span{color:var(--muted);font-size:13px}.fuelbox .tot{grid-template-columns:1fr auto;border-top:1px dashed #E3C98A;padding-top:6px}
.lines{display:flex;flex-direction:column;gap:1px;margin-top:3px;color:var(--muted);font-size:13px;line-height:1.45}.lines bdi{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
